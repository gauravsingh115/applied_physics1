<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solving 1-D Motion</title>
<style>
  :root{ --ink:#111; --sub:#666; --line:#ddd; --good:#1a7f37; --bad:#c1373f; }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink); max-width:720px; margin:0 auto; padding:2.5rem 1.25rem 5rem;
    line-height:1.55;
  }
  nav{font-size:.82rem; color:var(--sub); margin-bottom:2rem;}
  nav a{color:var(--sub); margin-right:1rem; text-decoration:none; border-bottom:1px solid var(--line);}
  nav a.here{color:var(--ink); border-bottom-color:var(--ink);}
  h1{font-size:1.5rem; margin:0 0 .8rem;}
  h2{font-size:1.05rem; margin:2.4rem 0 .8rem; border-top:1px solid var(--line); padding-top:1.5rem;}
  p{color:#333; margin:0 0 1rem; max-width:62ch;}
  canvas{width:100%; display:block; border:1px solid var(--line); margin:1rem 0;}
  label{display:flex; justify-content:space-between; font-size:.85rem; color:var(--sub); margin-bottom:.3rem;}
  label span.v{color:var(--ink); font-family:ui-monospace,Menlo,monospace;}
  input[type=range]{width:100%;}
  .controls{display:flex; gap:2rem; flex-wrap:wrap; margin:1.2rem 0;}
  .controls > div{flex:1; min-width:200px;}
  .readout{font-size:.85rem; color:#333; margin:.75rem 0 0; display:flex; gap:1.5rem; flex-wrap:wrap;}
  .readout .stat{white-space:nowrap;}
  .readout .stat .val{font-family:ui-monospace,Menlo,monospace; color:#111;}
  .btnRow{display:flex; gap:.6rem; margin-top:1rem;}
  button{font-family:inherit; font-size:.85rem; padding:.4rem .9rem; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;}
  button:hover{background:#f2f2f2;}
  .exercise{margin:1.4rem 0;}
  .exercise p{margin-bottom:.6rem;}
  .er{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;}
  input[type=number]{font-family:inherit; padding:.35rem .5rem; border:1px solid var(--line); width:100px;}
  .fb{margin-top:.5rem; font-size:.85rem; min-height:1.1em;}
  .fb.good{color:var(--good);} .fb.bad{color:var(--bad);}
</style>
</head>
<body>

<nav>
  <a href="relative-motion.html">Relative Motion</a>
  <a class="here" href="one-d-motion.html">1-D Motion</a>
  <a href="projectile-motion.html">Projectile Motion</a>
  <a href="multi-d-motion.html">Multi-D Motion</a>
  <a href="cricket-run-out.html">Cricket Run-Out Game</a>
</nav>

<h1>Solving 1-D Motion</h1>
<p>Constant-acceleration motion along a line is described by two equations: v(t) = v<sub>0</sub> + a t, and x(t) = v<sub>0</sub>t + ½at². Set v<sub>0</sub> and a, then scrub or play through time.</p>

<canvas id="lane" style="height:80px"></canvas>
<canvas id="graphs" style="height:220px"></canvas>

<div class="readout" id="readout"></div>

<div class="controls">
  <div>
    <label>Initial velocity v<sub>0</sub> <span class="v" id="v0Label">4 m/s</span></label>
    <input type="range" id="v0" min="-15" max="15" step="1" value="4">
  </div>
  <div>
    <label>Acceleration a <span class="v" id="aLabel">-2 m/s²</span></label>
    <input type="range" id="a" min="-8" max="8" step="0.5" value="-2">
  </div>
</div>
<div class="controls">
  <div>
    <label>Time window <span class="v" id="tMaxLabel">8 s</span></label>
    <input type="range" id="tMax" min="3" max="14" step="1" value="8">
  </div>
  <div>
    <label>Scrub time <span class="v" id="scrubLabel">0.0 s</span></label>
    <input type="range" id="scrub" min="0" max="8" step="0.05" value="0">
  </div>
</div>

<div class="btnRow">
  <button id="playBtn">Play</button>
  <button id="resetBtn">Reset</button>
</div>

<h2>Exercises</h2>

<div class="exercise" id="ex1">
  <p id="ex1q"></p>
  <div class="er">
    <input type="number" id="ex1i" step="any"><span style="font-size:.82rem;color:var(--sub)" id="ex1u">m/s</span>
    <button id="ex1c">Check</button>
    <button id="ex1n">New numbers</button>
  </div>
  <div class="fb" id="ex1f"></div>
</div>

<div class="exercise" id="ex2">
  <p id="ex2q"></p>
  <div class="er">
    <input type="number" id="ex2i" step="any"><span style="font-size:.82rem;color:var(--sub)" id="ex2u">m</span>
    <button id="ex2c">Check</button>
    <button id="ex2n">New numbers</button>
  </div>
  <div class="fb" id="ex2f"></div>
</div>

<div class="exercise" id="ex3">
  <p id="ex3q"></p>
  <div class="er">
    <input type="number" id="ex3i" step="any"><span style="font-size:.82rem;color:var(--sub)">s</span>
    <button id="ex3c">Check</button>
    <button id="ex3n">New numbers</button>
  </div>
  <div class="fb" id="ex3f"></div>
</div>

<script>
function fmt(n,d){ if(d===undefined) d=1; return Number(n).toFixed(d); }
function rand(min,max){ return Math.round(Math.random()*(max-min))+min; }
function nonZeroRand(min,max){ let v; do{ v=rand(min,max); }while(v===0); return v; }

// ---------- canvas setup ----------
function makeCanvas(id, cssHeight){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  const state = {canvas, ctx, w:0, h:cssHeight};
  function resize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    state.w = rect.width;
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(cssHeight*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();
  return state;
}
const lane = makeCanvas('lane', 80);
const graphs = makeCanvas('graphs', 220);

// ---------- state ----------
let v0 = parseFloat(document.getElementById('v0').value);
let a = parseFloat(document.getElementById('a').value);
let tMax = parseFloat(document.getElementById('tMax').value);
let t = 0, playing = false;

function xAt(tt){ return v0*tt + 0.5*a*tt*tt; }
function vAt(tt){ return v0 + a*tt; }

const scrubEl = document.getElementById('scrub');
function syncScrubRange(){
  scrubEl.max = tMax;
  if(t>tMax) t = tMax;
  scrubEl.value = t;
  document.getElementById('scrubLabel').textContent = fmt(t,2)+' s';
}

document.getElementById('v0').addEventListener('input', e=>{
  v0 = parseFloat(e.target.value);
  document.getElementById('v0Label').textContent = v0+' m/s';
});
document.getElementById('a').addEventListener('input', e=>{
  a = parseFloat(e.target.value);
  document.getElementById('aLabel').textContent = a+' m/s²';
});
document.getElementById('tMax').addEventListener('input', e=>{
  tMax = parseFloat(e.target.value);
  document.getElementById('tMaxLabel').textContent = tMax+' s';
  syncScrubRange();
});
scrubEl.addEventListener('input', e=>{
  t = parseFloat(e.target.value);
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('scrubLabel').textContent = fmt(t,2)+' s';
});
document.getElementById('playBtn').addEventListener('click', e=>{
  if(t>=tMax) t = 0;
  playing = !playing;
  e.target.textContent = playing ? 'Pause' : 'Play';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  t = 0; playing = false;
  document.getElementById('playBtn').textContent = 'Play';
});

document.getElementById('v0Label').textContent = v0+' m/s';
document.getElementById('aLabel').textContent = a+' m/s²';
document.getElementById('tMaxLabel').textContent = tMax+' s';
syncScrubRange();

function update(dt){
  if(!playing) return;
  t += dt;
  if(t>=tMax){ t=tMax; playing=false; document.getElementById('playBtn').textContent='Play'; }
  scrubEl.value = t;
  document.getElementById('scrubLabel').textContent = fmt(t,2)+' s';
}

function sampleRange(fn){
  let min=Infinity, max=-Infinity;
  const n=80;
  for(let i=0;i<=n;i++){ const val=fn(i/n*tMax); if(val<min)min=val; if(val>max)max=val; }
  if(min===max){ min-=1; max+=1; }
  const pad = (max-min)*0.1;
  return {min:min-pad, max:max+pad};
}

function drawMiniChart(ctx, x0,y0,w,h, fn, currentVal, title){
  ctx.strokeStyle = '#ddd'; ctx.lineWidth=1;
  ctx.strokeRect(x0,y0,w,h);
  ctx.fillStyle = '#666'; ctx.font = '11px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText(title, x0+4, y0+12);
  const pad = 18;
  const plotY0 = y0+pad, plotH = h-pad-14;
  const {min,max} = sampleRange(fn);
  function yPix(v){ return plotY0 + plotH - (v-min)/(max-min)*plotH; }
  if(min<0 && max>0){
    ctx.strokeStyle = '#eee';
    ctx.beginPath(); ctx.moveTo(x0, yPix(0)); ctx.lineTo(x0+w, yPix(0)); ctx.stroke();
  }
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.75;
  ctx.beginPath();
  const n=60;
  for(let i=0;i<=n;i++){
    const tt = i/n*tMax;
    const px = x0 + (tt/tMax)*w;
    const py = yPix(fn(tt));
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
  const mx = x0 + (t/tMax)*w;
  const my = yPix(currentVal);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(mx,my,3.5,0,Math.PI*2); ctx.fill();
  ctx.font='600 11px ui-monospace,monospace'; ctx.textAlign='right';
  ctx.fillText(fmt(currentVal,1), x0+w-4, y0+12);
}

function draw(){
  const lctx = lane.ctx;
  lctx.clearRect(0,0,lane.w,lane.h);
  const range = sampleRange(xAt);
  const span = Math.max(Math.abs(range.min), Math.abs(range.max), 1);
  const cx = lane.w/2;
  const sc = (lane.w/2 - 30) / span;
  lctx.strokeStyle = '#ddd'; lctx.lineWidth=1;
  lctx.beginPath(); lctx.moveTo(0,lane.h*0.6); lctx.lineTo(lane.w,lane.h*0.6); lctx.stroke();
  lctx.beginPath(); lctx.moveTo(cx,lane.h*0.6-8); lctx.lineTo(cx,lane.h*0.6+8); lctx.stroke();
  lctx.fillStyle = '#666'; lctx.font='11px -apple-system,sans-serif'; lctx.textAlign='center';
  lctx.fillText('x = 0', cx, lane.h*0.6+22);
  const curX = xAt(t);
  const carX = cx + curX*sc;
  lctx.fillStyle = '#111';
  lctx.beginPath(); lctx.arc(carX, lane.h*0.6-16, 10, 0, Math.PI*2); lctx.fill();

  const gctx = graphs.ctx;
  gctx.clearRect(0,0,graphs.w,graphs.h);
  const colW = graphs.w/3 - 8;
  drawMiniChart(gctx, 0, 4, colW, graphs.h-8, xAt, curX, 'x(t)');
  drawMiniChart(gctx, colW+12, 4, colW, graphs.h-8, vAt, vAt(t), 'v(t)');
  drawMiniChart(gctx, 2*(colW+12), 4, colW, graphs.h-8, ()=>a, a, 'a(t)');

  document.getElementById('readout').innerHTML =
    '<span class="stat">t <span class="val">'+fmt(t,2)+' s</span></span>'+
    '<span class="stat">x <span class="val">'+fmt(curX,2)+' m</span></span>'+
    '<span class="stat">v <span class="val">'+fmt(vAt(t),2)+' m/s</span></span>'+
    '<span class="stat">a <span class="val">'+fmt(a,2)+' m/s²</span></span>';
}

let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- exercises ----------
function checkNumeric(inputEl, correct, tol, fbEl, unit){
  const v = parseFloat(inputEl.value);
  if(isNaN(v)){ fbEl.textContent='Enter a number first.'; fbEl.className='fb bad'; return; }
  if(Math.abs(v-correct)<=tol){
    fbEl.textContent = 'Correct — '+fmt(correct,2)+' '+unit+'.';
    fbEl.className = 'fb good';
  } else {
    fbEl.textContent = 'Not quite. The answer is '+fmt(correct,2)+' '+unit+'.';
    fbEl.className = 'fb bad';
  }
}

let e1v0,e1a,e1t;
function newEx1(){
  e1v0=rand(-10,10); e1a=nonZeroRand(-5,5); e1t=rand(1,8);
  document.getElementById('ex1q').textContent =
    'An object starts at v0 = '+e1v0+' m/s and accelerates at a = '+e1a+' m/s². What is its velocity at t = '+e1t+' s?';
  document.getElementById('ex1i').value=''; document.getElementById('ex1f').textContent=''; document.getElementById('ex1f').className='fb';
}
document.getElementById('ex1c').addEventListener('click', ()=>{
  checkNumeric(document.getElementById('ex1i'), e1v0+e1a*e1t, 0.5, document.getElementById('ex1f'), 'm/s');
});
document.getElementById('ex1n').addEventListener('click', newEx1);

let e2v0,e2a,e2t;
function newEx2(){
  e2v0=rand(-10,10); e2a=nonZeroRand(-5,5); e2t=rand(1,8);
  document.getElementById('ex2q').textContent =
    'An object starts at v0 = '+e2v0+' m/s and accelerates at a = '+e2a+' m/s². What is its displacement at t = '+e2t+' s?';
  document.getElementById('ex2i').value=''; document.getElementById('ex2f').textContent=''; document.getElementById('ex2f').className='fb';
}
document.getElementById('ex2c').addEventListener('click', ()=>{
  const correct = e2v0*e2t+0.5*e2a*e2t*e2t;
  checkNumeric(document.getElementById('ex2i'), correct, Math.max(0.5,Math.abs(correct)*0.05), document.getElementById('ex2f'), 'm');
});
document.getElementById('ex2n').addEventListener('click', newEx2);

let e3v0,e3a,e3vf;
function newEx3(){
  e3v0=rand(-8,8); e3a=nonZeroRand(1,5)*(Math.random()<0.5?-1:1);
  const tPick = rand(2,8);
  e3vf = e3v0+e3a*tPick;
  document.getElementById('ex3q').textContent =
    'An object starts at v0 = '+e3v0+' m/s and accelerates at a = '+e3a+' m/s². How long does it take to reach a velocity of '+fmt(e3vf,1)+' m/s?';
  document.getElementById('ex3i').value=''; document.getElementById('ex3f').textContent=''; document.getElementById('ex3f').className='fb';
}
document.getElementById('ex3c').addEventListener('click', ()=>{
  const correct = (e3vf-e3v0)/e3a;
  checkNumeric(document.getElementById('ex3i'), correct, 0.3, document.getElementById('ex3f'), 's');
});
document.getElementById('ex3n').addEventListener('click', newEx3);

newEx1(); newEx2(); newEx3();
</script>
</body>
</html>
